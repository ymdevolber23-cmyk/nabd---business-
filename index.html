  <title>Nabd Business — لوحة التشغيل</title>
  <style>
    /* Terminal Noir reminder: high-contrast dark utility UI; cobalt directs, teal confirms. */
    :root{color-scheme:dark;--bg:#060b14;--panel:#0b1320;--panel-2:#0e1928;--panel-3:#101f31;--line:rgba(152,181,218,.14);--line-strong:rgba(152,181,218,.23);--text:#eff5ff;--muted:#91a4bc;--faint:#65778e;--blue:#2f6bff;--blue-2:#82a3ff;--teal:#36e0c5;--orange:#ffb86b;--red:#ff7184;--shadow:0 24px 80px rgba(0,0,0,.28);--radius:12px;--mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;--sans:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;--ease:cubic-bezier(.23,1,.32,1)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.65;overflow-x:hidden}button,input,select,textarea{font:inherit}button{border:0;color:inherit;cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:3px}.app{min-height:100vh;display:flex;position:relative;background:radial-gradient(900px 460px at 68% -5%,rgba(47,107,255,.12),transparent 60%),var(--bg)}.app:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.26;background-image:linear-gradient(rgba(105,149,220,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(105,149,220,.04) 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,#000,transparent 88%)}
    .hidden{display:none!important}.sidebar{width:258px;flex:0 0 258px;border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(10,19,32,.99),rgba(6,11,20,.99));display:flex;flex-direction:column;min-height:100vh;padding:21px 15px;position:sticky;top:0;height:100vh;z-index:8}.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 25px}.brand img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 7px 16px rgba(47,107,255,.28))}.brand strong{font-size:18px;letter-spacing:-.3px}.brand small{display:block;color:var(--muted);font:9px var(--mono);letter-spacing:1px;text-transform:uppercase;direction:ltr}.workspace{margin:0 3px 23px;padding:11px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}.workspace-state{display:flex;gap:10px;align-items:center;min-width:0}.workspace-state b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.workspace-state small{display:block;color:var(--muted);font-size:9px}.dot{display:inline-block;flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(54,224,197,.09),0 0 13px rgba(54,224,197,.7)}.chev{color:var(--faint);font-size:17px}.nav-label{padding:0 11px;color:var(--faint);font:9px var(--mono);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;direction:ltr}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;color:var(--muted);background:transparent;border-radius:8px;text-align:right;transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease);position:relative}.nav button:hover{background:rgba(255,255,255,.045);color:var(--text);transform:translateX(-2px)}.nav button.active{background:linear-gradient(90deg,rgba(47,107,255,.19),rgba(47,107,255,.055));color:#fff}.nav button.active:before{content:"";position:absolute;right:-15px;width:3px;height:22px;background:var(--blue);border-radius:2px 0 0 2px;box-shadow:0 0 13px rgba(47,107,255,.65)}.nav .icon{width:20px;text-align:center;color:var(--faint);font:14px var(--mono)}.nav button.active .icon{color:var(--blue-2)}.nav-break{margin-top:22px}.sidebar-foot{margin-top:auto;padding:14px 9px 2px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.sidebar-foot .uptime{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.sidebar-foot em{color:var(--teal);font:9px var(--mono);font-style:normal;direction:ltr}.mini-link{display:flex;justify-content:space-between;color:var(--faint);font:9px var(--mono);direction:ltr}
    .main{min-width:0;flex:1;padding:21px 34px 42px;max-width:1600px;margin:0 auto;width:100%;position:relative}.topbar{height:52px;display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:15px}.crumbs{display:flex;align-items:center;gap:9px;color:var(--faint);font-size:11px}.crumbs strong{color:var(--text);font-weight:600}.slash{font:10px var(--mono);color:#314158}.top-actions{display:flex;align-items:center;gap:8px}.icon-btn{width:37px;height:37px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:all .18s var(--ease);position:relative}.icon-btn:hover{color:#fff;border-color:var(--line-strong);background:rgba(255,255,255,.06)}.icon-btn:active,.btn:active,.quick:active{transform:scale(.97)}.badge{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px var(--bg)}.avatar{width:37px;height:37px;border-radius:10px;background:linear-gradient(145deg,#17366e,#102244);display:grid;place-items:center;color:#d3dfff;font-weight:700;border:1px solid rgba(110,150,255,.28)}.hamburger{display:none}.global-search{display:none;position:absolute;z-index:7;top:61px;left:81px;width:min(370px,calc(100% - 100px));padding:8px;background:#101f31;border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow)}.global-search.open{display:block}.global-search input{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:#091422;color:var(--text);outline:none}.global-search small{display:block;color:var(--faint);font-size:9px;padding:5px 3px 0}

      function renderOverview(){const actualToday=data.appointments.filter(a=>a.date===todayDate);const seedToday=defaults.appointments.filter(a=>a.date===todayDate);const total=24+actualToday.length-seedToday.length;const confirmed=18+actualToday.filter(a=>a.status==='confirmed').length-seedToday.filter(a=>a.status==='confirmed').length;const customerCount=156+data.customers.length-defaults.customers.length;const table=data.appointments.filter(a=>a.date===todayDate).slice().sort((a,b)=>a.time.localeCompare(b.time)).slice(0,5);return `<section class="hero"><div class="hero-copy"><div class="demo-ribbon">DEMO · بيانات محلية للتجربة</div><div class="eyebrow">TUESDAY / 24 NOV 2026</div><h1>شغّل يومك من <span>لوحة واحدة.</span></h1><p>أدر مواعيدك وعملاءك وفريقك من مساحة عمل واحدة واضحة وسريعة.</p></div><div class="hero-aside"><div class="system-chip ${data.settings.showStatus?'':'hidden'}"><i class="pulse"></i> ALL SYSTEMS NOMINAL</div><div class="hero-meta">آخر مزامنة <b id="syncTime">09:42:16</b> · Riyadh / UTC+3</div></div></section>${section('ملخص اليوم','LIVE SNAPSHOT · NODE 01')}<div style="display:flex;justify-content:flex-end;margin-top:-35px;margin-bottom:8px"><button class="view-all" data-action="refresh">تحديث البيانات ↻</button></div><section class="kpi-grid" aria-label="مؤشرات الأداء"><article class="kpi"><div class="kpi-label"><span>مواعيد اليوم</span><span class="kpi-icon">◷</span></div><div class="kpi-value">${total}</div><div class="kpi-foot"><span class="up">↑ 12%</span><span>عن الأسبوع الماضي</span></div></article><article class="kpi"><div class="kpi-label"><span>مواعيد مؤكدة</span><span class="kpi-icon">✓</span></div><div class="kpi-value">${confirmed}</div><div class="kpi-foot"><span class="up">${total?Math.round(confirmed/total*100):0}%</span><span>من حجوزات اليوم</span></div></article><article class="kpi"><div class="kpi-label"><span>عملاء نشطون</span><span class="kpi-icon">◎</span></div><div class="kpi-value">${customerCount}</div><div class="kpi       function renderAppointments(){let list=data.appointments.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));if(apptFilter!=='all')list=list.filter(a=>a.status===apptFilter);if(tableQuery)list=list.filter(a=>`${a.name} ${a.service} ${a.id} ${a.status}`.toLowerCase().includes(tableQuery.toLowerCase()));const actualToday=data.appointments.filter(a=>a.date===todayDate),seedToday=defaults.appointments.filter(a=>a.date===todayDate);const today=24+actualToday.length-seedToday.length,pending=6+actualToday.filter(a=>a.status==='pending').length-seedToday.filter(a=>a.status==='pending').length;return `${heading('المواعيد','تابع الحجوزات وحالاتها في مساحة واحدة.','APPOINTMENTS / QUEUE',`<button class="btn btn-primary" data-action="new-appointment">＋ موعد جديد</button>`)}<div class="metric-strip"><div class="metric-mini"><span>إجمالي الحجوزات اليوم</span><strong>${today}</strong></div><div class="metric-mini"><span>بانتظار التأكيد</span><strong>${pending}</strong></div><div class="metric-mini"><span>كل المواعيد المسجلة</span><strong>${data.appointments.length}</strong></div></div><section class="panel"><div class="toolbar"><div class="toolbar-group"><span class="toolbar-label">عرض:</span><select class="filter-select" id="apptFilter" aria-label="تصفية حسب الحالة"><option value="all" ${apptFilter==='all'?'selected':''}>كل الحالات</option><option value="confirmed" ${apptFilter==='confirmed'?'selected':''}>مؤكد</option><option value="pending" ${apptFilter==='pending'?'selected':''}>بانتظار التأكيد</option><option value="completed" ${apptFilter==='completed'?'selected':''}>مكتمل</option><option value="cancelled" ${apptFilter==='cancelled'?'selected':''}>ملغي</option></select></div><div class="toolbar-group"><button class="btn btn-quiet" data-action="export-appointments">تصدير CSV</button></div></div><div class="table-wrap"><table class="data-table" style="min-width:760px"><thead><tr><th>الوقت</th><th>العميل</th><th>الخدمة</th><th>الحالة</th><th>التاريخ</th><th>إ viceCount()/totalServiceCount()*100)}%"></i></div></div></section>`}

/b></div><div class="report-line"><span>الإصدار</span><b>0.1.0-MVP</b></div><div class="report-line"><span>اللغة</span><b>AR / RTL</b></div><div class="report-line"><span>بيئة التشغيل</span><b>LOCAL DEMO</b></div></div></section></div>`}
      function renderHelp(){const faqs=[['كيف أضيف موعدًا؟','افتح وحدة المواعيد ثم اختر «موعد جديد». أدخل اسم العميل والخدمة والموعد، وسيظهر السجل في الجدول المحلي.'],['هل البيانات متصلة بخادم؟','لا. هذه نسخة Demo مستقلة. البيانات الابتدائية توضيحية، والتعديلات تحفظ في التخزين المحلي للمتصفح فقط.'],['كيف أرجع إلى بيانات البداية؟','من وحدة الإعدادات اختر «إعادة ضبط بيانات Demo» لتصفير التغييرات المحلية وإعادة العينة الأصلية.'],['ما الوحدات التي يغطيها المخطط؟','نظرة عامة، المواعيد، العملاء، الخدمات، الموظفون، التقارير، الإعدادات، ومركز المساعدة.'],['هل يمكن فتح الصفحة دون تثبيت؟','نعم. افتح ملف HTML النهائي مباشرة في متصفح حديث؛ الصور المضمنة لا تحتاج إلى ملفات منفصلة.']];return `${heading('مركز المساعدة','إجابات سريعة حول النموذج وحدوده.','HELP / KNOWLEDGE BASE')}<section class="panel" style="padding:15px"><div class="faq-list">${faqs.map((f,i)=>`<div class="faq-item ${i===0?'open':''}"><button class="faq-question" aria-expanded="${i===0?'true':'false'}"><span>${esc(f[0])}</span><span>${i===0?'−':'+'}</span></button><div class="faq-answer">${esc(f[1])}</div></div>`).join('')}</div><div class="demo-note">هذه الواجهة لا تحتوي على تكامل دعم مباشر؛ المحتوى هنا إرشادات مدمجة داخل النموذج.</div></section>`}
      function render(){document.getElementById('workspaceName').textContent=data.workspace||defaults.workspace;const views={overview:renderOverview,appointments:renderAppointments,customers:renderCustomers,services:renderServices,staff:renderStaff,reports:renderReports,settings:renderSettings,help:renderHelp};host.innerHTML=views[view]();}
      function openModal(kind){let title='',fields='';if(kind==='appointment'){title='موعد جديد';fields=`<div class="field"><label for="fName">اسم العميل</label><input id="fName" name="name" required maxlength="55" placeholder="مثال: سارة العتيبي" /></div><div class="field"><label for="fService">الخدمة</label><select id="fService" name="service" required>${data.services.filter(s=>s.active).map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="form-row"><div class="field"><label for="fDate">التاريخ</label><input id="fDate" name="date" type="date" value="2026-11-24" required /></div><div class="field"><label for="fTime">الوقت</label><input id="fTime" name="time" type="time" value="14:00" required /></div></div><p class="demo-note">سيُحفظ الموعد داخل النموذج على هذا الجهاز فقط.</p>`}else if(kind==='customer'){title='إضافة عميل';fields=`<div class="field"><label for="fName">اسم العميل</label><input id="fName" name="name" required maxlength="55" /></div><div class="field"><label for="fPhone">رقم التواصل التجريبي</label><input id="fPhone" name="phone" maxlength="24" placeholder="مثال: 05X ••• XXXX" /></div><div class="demo-note">استخدم بيانات غير حقيقية في هذا النموذج التجريبي.</div>`}else if(kind==='service'){title='إضافة خدمة';fields=`<div class="field"><label for="fName">اسم الخدمة</label><input id="fName" name="name" required maxlength="50" /></div><div class="field"><label for="fCategory">التصنيف</label><input id="fCategory" name="category" required maxlength="30" value="استشارات" /></div><div class="form-row"><div class="field"><label for="fDuration">المدة بالدقائق</label><input id="fDuration" name="duration" type="number" min="5" max="480" value="30" required /></div><div class="field"><label for="fPrice">السعر (ر.س)</label><input id="fPrice" name="price" type="number" min="0" value="200" required /></div></div>`}else if(kind==='staff'){title='إضافة عضو فريق';fields=`<div class="field"><label for="fName">الاسم</label><input id="fName" name="name" required maxlength="55" /></div><div class="field"><label for="fRole">الدور الوظيفي</label><input id="fRole" name="role" required maxlength="40" value="عضو فريق" /></div><div class="field"><label for="fShift">المناوبة</label><input id="fShift" name="shift" required maxlength="30" value="09:00 — 17:00" /></div>`}modalHost.innerHTML=`<form class="modal" id="demoForm" data-kind="${esc(kind)}"><div class="modal-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-action="close-modal" aria-label="إغلاق">×</button></div><div class="modal-body">${fields}</div><div class="modal-foot"><button class="btn btn-primary" type="submit">حفظ في Demo</button><button class="btn btn-quiet" type="button" data-action="close-modal">إلغاء</button></div></form>`;modalHost.classList.add('open');modalHost.setAttribute('aria-hidden','false');setTimeout(()=>modalHost.querySelector('input')?.focus(),30)}
      function closeModal(){modalHost.classList.remove('open');modalHost.setAttribute('aria-hidden','true');modalHost.innerHTML=''}
      function csvDownload(filename,rows){const body='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([body],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);showToast('تم تجهيز ملف CSV','التصدير من بيانات النموذج المحلي فقط.')}
      function handleAction(action,el){const id=el.dataset.id;if(action==='refresh'){const time=new Date().toLocaleTimeString('en-GB',{hour12:false});if(view==='overview'){const node=document.getElementById('syncTime');if(node)node.textContent=time}showToast('تم تحديث البيانات','تمت إعادة عرض مؤشرات النموذج المحلي.')}else if(action==='new-appointment')openModal('appointment');else if(action==='new-customer')openModal('customer');else if(action==='new-service')openModal('service');else if(action==='new-staff')openModal('staff');else if(action==='close-modal')closeModal();else if(action==='cycle-status'){const a=data.appointments.find(x=>x.id===id);if(a){const sequence=['pending','confirmed','completed','cancelled'];a.status=sequence[(sequence.indexOf(a.status)+1)%sequence.length];save();render();showToast('تغيّرت حالة الموعد',`الحالة الجديدة: ${statusLabel[a.status]}.`)}}else if(action==='toggle-service'){const s=data.services.find(x=>x.id===id);if(s){s.active=!s.active;save();render();showToast('تم تحديث الخدمة',`${s.name} — ${s.active?'مفعّلة':'متوقفة'}.`)}}else if(action==='customer-detail'){const c=data.customers.find(x=>x.id===id);if(c){const appointments=data.appointments.filter(a=>a.customerId===c.id);const message=`<div class="modal"><div class="modal-head"><h2>سجل العميل</h2><button type="button" class="icon-btn" data-action="close-modal" aria-label="إغلاق">×</button></div><div class="modal-body"><div class="entity-person" style="margin-bottom:15px"><span class="client-avatar">${esc(initials(c.name))}</span><div><strong>${esc(c.name)}</strong><small>${esc(c.id)} · ${esc(c.status)}</small></div></div><div class="report-list"><div class="report-line"><span>الهاتف</span><b>${esc(c.phone)}</b></div><div class="report-line"><span>عدد الزيارات</span><b>${esc(c.visits)}</b></div><div class="report-line"><span>آخر زيارة</span><b>${esc(c.last)}</b></div><div class="report-line"><span>مواعيد في العينة</span><b>${appointments.length}</b></div></div><p class="demo-note">بيانات عينة محلية غير مرتبطة بنظام عملاء.</p></div><div class="modal-foot"><button class="btn btn-quiet" data-action="close-modal">إغلاق</button></div></div>`;modalHost.innerHTML=message;modalHost.classList.add('open');modalHost.setAttribute('aria-hidden','false')}}else if(action==='staff-shift'){const s=data.staff.find(x=>x.id===id);if(s)showToast(`مناوبة ${s.name}`,`${s.shift} · ${s.status} — بيانات توضيحية.`)}else if(action==='export-appointments'){csvDownload('nabd-appointments-demo.csv',[['المعرف','التاريخ','الوقت','العميل','الخدمة','الحالة'],...data.appointments.map(a=>[a.id,a.date,a.time,a.name,a.service,statusLabel[a.status]||a.status])])}else if(action==='export-report'){csvDownload('nabd-report-demo.csv',[['المؤشر','القيمة'],['المواعيد اليوم',data.appointments.filter(a=>a.date===todayDate).length],['العملاء',data.customers.length],['الخدمات النشطة',data.services.filter(s=>s.active).length],['رضا العملاء','4.8 / 5']])}else if(action==='reset-demo'){data=structuredClone(defaults);save();tableQuery='';setView('overview');showToast('أعيد ضبط البيانات','عادت العينة إلى قيم البداية.')}else if(action==='demo-toggle'){const setting=el.dataset.setting;if(setting&&Object.hasOwn(data.settings,setting)){data.settings[setting]=el.checked;save();render();showToast('تم تحديث تفضيل العرض',setting==='remember'&&!el.checked?'لن تُحفظ التغييرات بعد الآن.':'حُفظ التفضيل ضمن إعدادات Demo المحلية.')}}}
      document.body.addEventListener('click',event=>{const viewButton=event.target.closest('[data-view]');if(viewButton){setView(viewButton.dataset.view);return}const actionButton=event.target.closest('[data-action]');if(actionButton){handleAction(actionButton.dataset.action,actionButton);return}const faq=event.target.closest('.faq-question');if(faq){const item=faq.closest('.faq-item');item.classList.toggle('open');faq.setAttribute('aria-expanded',item.classList.contains('open')?'true':'false');faq.lastElementChild.textContent=item.classList.contains('open')?'−':'+'}});
      document.getElementById('menuBtn').addEventListener('click',openMenu);overlay.addEventListener('click',closeMenu);document.getElementById('notifyBtn').addEventListener('click',()=>showToast('لا توجد تنبيهات جديدة','كل العمليات في النموذج ضمن الحالة الطبيعية.'));document.getElementById('searchBtn').addEventListener('click',()=>{const box=document.getElementById('globalSearchBox');box.classList.toggle('open');if(box.classList.contains('open'))document.getElementById('globalSearch').focus();else{tableQuery='';render()}});
      document.getElementById('globalSearch').addEventListener('input',event=>{tableQuery=event.target.value;const active=document.activeElement;render();const input=document.getElementById('globalSearch');input.value=tableQuery;input.focus()});
      document.getElementById('viewHost').addEventListener('change',event=>{if(event.target.id==='apptFilter'){apptFilter=event.target.value;render()}});
      document.getElementById('viewHost').addEventListener('submit',event=>{if(event.target.id==='settingsForm'){event.preventDefault();const form=new FormData(event.target);data.workspace=String(form.get('workspace')||defaults.workspace).trim()||defaults.workspace;data.settings.timezone=String(form.get('timezone')||'riyadh');save();render();showToast('تم حفظ الإعدادات','اسم مساحة العمل حُفظ محليًا.')}});
      modalHost.addEventListener('click',event=>{if(event.target===modalHost)closeModal()});modalHost.addEventListener('submit',event=>{if(event.target.id!=='demoForm')return;event.preventDefault();const form=new FormData(event.target),kind=event.target.dataset.kind;const value=name=>String(form.get(name)||'').trim();if(kind==='appointment'){const customer=data.customers.find(c=>c.name===value('name'));const suffix=String(Date.now()).slice(-4);data.appointments.push({id:`APT-${suffix}`,date:value('date'),time:value('time'),name:value('name'),customerId:customer?.id||`CUS-${suffix}`,service:value('service'),status:'pending'});if(!customer)data.customers.push({id:`CUS-${suffix}`,name:value('name'),phone:'غير مدخل',visits:0,last:'—',status:'جديد'});save();closeModal();setView('appointments');showToast('تمت إضافة الموعد','أضيف إلى بيانات Demo المحلية بحالة انتظار التأكيد.')}else if(kind==='customer'){const suffix=String(Date.now()).slice(-4);data.customers.push({id:`CUS-${suffix}`,name:value('name'),phone:value('phone')||'غير مدخل',visits:0,last:'—',status:'جديد'});save();closeModal();setView('customers');showToast('تمت إضافة العميل','حُفظ سجل تجريبي على هذا المتصفح.')}else if(kind==='service'){const suffix=String(Date.now()).slice(-2);data.services.push({id:`SRV-${suffix}`,name:value('name'),category:value('category'),duration:Number(value('duration')),price:Number(value('price')),active:true});save();closeModal();setView('services');showToast('تمت إضافة الخدمة','أُدرجت في قائمة الخدمات التجريبية.')}else if(kind==='staff'){const suffix=String(Date.now()).slice(-2);data.staff.push({id:`STF-${suffix}`,name:value('name'),role:value('role'),shift:value('shift'),status:'متصل'});save();closeModal();setView('staff');showToast('تمت إضافة عضو الفريق','تحديث تجريبي محفوظ محليًا.')}});
      document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeModal();closeMenu();document.getElementById('globalSearchBox').classList.remove('open')}});
      render();
    })();
  </script>
</body>
</html>
